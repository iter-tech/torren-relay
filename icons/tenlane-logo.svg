<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 128" width="520" height="128" role="img" aria-label="Tenlane">
  <!-- Mark + "Tenlane" wordmark. The mark is icons/tenlane-mark.svg; the wordmark uses the system
       UI font stack the top bar uses (EXT-D13). For print or where fonts cannot be relied on,
       convert the text to outlines. -->
  <defs>
    <linearGradient id="tl-g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f409a"/>
      <stop offset=".55" stop-color="#2463ea"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#tl-g2)"/>
  <circle cx="87" cy="74" r="16" fill="#0ea5e9"/>
  <circle cx="87" cy="74" r="12" fill="#38bdf8"/>
  <rect x="34" y="30" width="60" height="17" rx="8.5" fill="#fff"/>
  <rect x="55.5" y="30" width="17" height="67" rx="8.5" fill="#fff"/>
  <text x="160" y="92" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif"
        font-size="84" font-weight="700" letter-spacing="-1" fill="#0e1c2b">Tenlane</text>
</svg>
