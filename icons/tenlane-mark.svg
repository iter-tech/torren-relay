<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Tenlane">
  <!-- The extension icon (icons/icon128.png) redrawn as vector: blue gradient tile, white rounded
       "T", cyan dot at the stem. Colours sampled from the PNG: #1f409a top-left, #2463ea middle,
       #0ea5e9 / #38bdf8 cyan. EXT-D13. -->
  <defs>
    <linearGradient id="tl-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f409a"/>
      <stop offset=".55" stop-color="#2463ea"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#tl-g)"/>
  <circle cx="87" cy="74" r="16" fill="#0ea5e9"/>
  <circle cx="87" cy="74" r="12" fill="#38bdf8"/>
  <rect x="34" y="30" width="60" height="17" rx="8.5" fill="#fff"/>
  <rect x="55.5" y="30" width="17" height="67" rx="8.5" fill="#fff"/>
</svg>
